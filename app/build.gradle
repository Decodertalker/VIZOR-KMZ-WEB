plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cajasgpon.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cajasgpon.app'
        minSdk 29
        targetSdk 34
        versionCode 36
        versionName '3.17'
    }
    // Firma fija: así cada APK nuevo se instala como ACTUALIZACIÓN sin borrar los datos del teléfono.
    // (versionCode debe subir en cada versión; applicationId y esta firma nunca deben cambiar)
    signingConfigs {
        debug {
            storeFile file('cajas.keystore')
            storePassword 'cajasgpon2026'
            keyAlias 'cajas'
            keyPassword 'cajasgpon2026'
        }
    }
    androidResources {
        noCompress 'pmtiles'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
